<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Google pide un favicon cuadrado y pequeño para mostrarlo en resultados de
      búsqueda; con solo /logo.png (1254x1254 y 1,4 MB) no lo tomaba y salía el
      globo genérico. Además /favicon.ico debe existir de verdad: al no estar, el
      fallback SPA del .htaccess devolvía index.html con un 200 y los rastreadores
      recibían HTML donde esperaban una imagen.
    -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>ARTORIA — Soporte automático por WhatsApp para tu ISP</title>
    <meta name="description" content="Plataforma de atención por WhatsApp con IA para proveedores de internet (ISP): atención 24/7, organiza cada caso para tu equipo y escala a tus especialistas. Integración completa con MikroWisp e ISPCONTROL." />
    <meta name="author" content="ARTORIA" />

    <meta property="og:title" content="ARTORIA — Soporte automático por WhatsApp para tu ISP" />
    <meta property="og:description" content="Atención por WhatsApp con IA para ISP: atención 24/7, organiza cada caso para tu equipo y escala a tus especialistas. Integración completa con MikroWisp e ISPCONTROL." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://artoria.cl/" />
    <meta property="og:image" content="https://artoria.cl/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@ARTORIA" />
    <meta name="twitter:image" content="https://artoria.cl/og-image.png" />
  </head>

  <body>

  </body>
</html>
